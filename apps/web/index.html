<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Mapa 3D de precios de combustible en Jalapa."
    />

    <title>Mapa de gasolineras de Jalapa</title>
  </head>

  <body>
    <div id="app">
      <main
        id="cesiumContainer"
        aria-label="Mapa 3D de gasolineras"
      ></main>

      <header class="encabezado">
        <div>
          <p class="subtitulo">
            Jalapa, Guatemala
          </p>

          <h1>
            Todos los precios de las gasolineras
          </h1>
        </div>

        <div
          id="estadoMapa"
          class="estado"
          role="status"
        >
          Cargando gasolineras...
        </div>
      </header>

      <nav
        class="menu-lateral"
        aria-label="Apartados principales"
      >
        <button
          class="pestana"
          type="button"
        >
          Cambiar precios
        </button>

        <button
          class="pestana pestana--activa"
          type="button"
        >
          Mapa 3D
        </button>

        <button
          class="pestana"
          type="button"
        >
          Gasolineras
        </button>

        <button
          class="pestana"
          type="button"
        >
          Salir
        </button>
      </nav>

      <aside
        id="tableroPrecios"
        class="tablero-precios"
        aria-live="polite"
        hidden
      ></aside>
    </div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
