<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Mapa 3D de precios de combustible en Jalapa."
    />

    <title>Mapa de gasolineras de Jalapa</title>
  </head>

  <body>
    <div id="app">
      <header class="encabezado">
        <div>
          <p class="subtitulo">Jalapa, Guatemala</p>

          <h1>
            Mapa de gasolineras y precios
          </h1>
        </div>

        <div
          id="estadoMapa"
          class="estado"
          role="status"
        >
          Cargando gasolineras...
        </div>
      </header>

      <main
        id="cesiumContainer"
        aria-label="Mapa 3D de gasolineras"
      ></main>
    </div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
