<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Iniciar sesión | Gasolineras Jalapa</title>

    <style>
      :root {
        font-family: "Segoe UI", Arial, sans-serif;
        color: #242731;
        background: #ffffff;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      button,
      input {
        font: inherit;
      }

      .login {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .panel-formulario {
        display: flex;
        flex-direction: column;
        padding: 42px 48px 28px;
      }

      .marca {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.5px;
      }

      .marca-simbolo {
        display: grid;
        place-items: center;
        width: 38px;
        height: 42px;
        border: 2px solid #3478f6;
        border-radius: 12px;
        color: #3478f6;
        font-size: 22px;
      }

      .contenido {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding: 64px 0;
      }

      .formulario {
        width: 100%;
        max-width: 390px;
      }

      .bienvenida {
        margin: 0 0 12px;
        color: #666b78;
        font-size: 17px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 35px);
        font-weight: 700;
        letter-spacing: -1px;
      }

      .descripcion {
        margin: 16px 0 40px;
        color: #747987;
        font-size: 15px;
        line-height: 1.6;
      }

      .campo {
        position: relative;
        margin-bottom: 28px;
      }

      .campo label {
        position: absolute;
        z-index: 1;
        top: -9px;
        left: 16px;
        padding: 0 7px;
        color: #747987;
        background: #ffffff;
        font-size: 13px;
      }

      .campo input {
        width: 100%;
        min-height: 62px;
        padding: 17px 21px;
        border: 1px solid #c9cdd5;
        border-radius: 5px;
        color: #242731;
        background: #ffffff;
        outline: none;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      .campo input::placeholder {
        color: #9296a0;
      }

      .campo:focus-within label {
        color: #3478f6;
      }

      .campo input:focus {
        border-color: #3478f6;
        box-shadow: 0 0 0 3px rgb(52 120 246 / 12%);
      }

      .campo-password input {
        padding-right: 90px;
      }

      .mostrar-password {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        min-height: 38px;
        padding: 6px;
        border: 0;
        border-radius: 4px;
        color: #596273;
        background: transparent;
        cursor: pointer;
        font-size: 12px;
      }

      button:focus-visible {
        outline: 3px solid #245dcc;
        outline-offset: 4px;
      }

      .boton-ingresar {
        width: 100%;
        min-height: 58px;
        border: 0;
        border-radius: 5px;
        color: #ffffff;
        background: #3478f6;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: background 150ms ease;
      }

      .boton-ingresar:hover {
        background: #2565db;
      }

      .boton-ingresar:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .mensaje {
        margin: 18px 0 0;
        padding: 12px 14px;
        border: 1px solid #f0c9c9;
        border-radius: 6px;
        color: #a02a2a;
        background: #fff5f5;
        font-size: 14px;
        line-height: 1.5;
      }

      [hidden] {
        display: none !important;
      }

      .pie {
        margin: 0;
        color: #838894;
        font-size: 13px;
      }

      .panel-visual {
        position: relative;
        overflow: hidden;
        min-height: 100%;
        background:
          radial-gradient(
            ellipse at 85% 15%,
            #ddd5f4 0,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 15% 85%,
            #79a9e8 0,
            transparent 60%
          ),
          linear-gradient(145deg, #e3edf9, #a8c7ee);
      }

      @media (max-width: 800px) {
        .login {
          grid-template-columns: 1fr;
        }

        .panel-visual {
          display: none;
        }

        .panel-formulario {
          min-height: 100dvh;
          padding: 28px 24px;
        }

        .marca {
          font-size: 19px;
        }

        .contenido {
          padding: 56px 0;
        }
      }
    </style>
  </head>

  <body>
    <main class="login">
      <section
        class="panel-formulario"
        aria-labelledby="tituloLogin"
      >
        <div class="marca">
          <span class="marca-simbolo" aria-hidden="true">G</span>
          <span>Gasolineras Jalapa</span>
        </div>

        <div class="contenido">
          <form id="formularioLogin" class="formulario">
            <p class="bienvenida">Te damos la bienvenida</p>

            <h1 id="tituloLogin">Iniciar sesión</h1>

            <p class="descripcion">
              Ingresa con tu cuenta para consultar los precios
              y acceder a las gasolineras de Jalapa.
            </p>

            <div class="campo">
              <label for="usuario">Usuario</label>
              <input
                id="usuario"
                name="usuario"
                type="text"
                placeholder="Escribe tu usuario"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                maxlength="100"
                required
              />
            </div>

            <div class="campo campo-password">
              <label for="password">Contraseña</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Escribe tu contraseña"
                autocomplete="current-password"
                required
              />

              <button
                id="mostrarPassword"
                class="mostrar-password"
                type="button"
                aria-controls="password"
                aria-pressed="false"
                aria-label="Mostrar contraseña"
              >
                Mostrar
              </button>
            </div>

            <button
              id="botonIngresar"
              class="boton-ingresar"
              type="submit"
            >
              Iniciar sesión
            </button>

            <p
              id="mensajeLogin"
              class="mensaje"
              role="alert"
              hidden
            ></p>
          </form>
        </div>

        <p class="pie">Jalapa, Guatemala</p>
      </section>

      <!-- Aquí colocaremos la fotografía más adelante. -->
      <aside class="panel-visual" aria-hidden="true"></aside>
    </main>

    <script type="module">
      const urlApi = (
        import.meta.env.VITE_API_URL
        ?? "http://localhost:3000/api"
      ).replace(/\/$/, "");

      const formulario = document.querySelector("#formularioLogin");
      const usuario = document.querySelector("#usuario");
      const password = document.querySelector("#password");
      const mostrar = document.querySelector("#mostrarPassword");
      const ingresar = document.querySelector("#botonIngresar");
      const mensaje = document.querySelector("#mensajeLogin");

      mostrar.addEventListener("click", () => {
        const visible = password.type === "password";

        password.type = visible ? "text" : "password";
        mostrar.textContent = visible ? "Ocultar" : "Mostrar";
        mostrar.setAttribute("aria-pressed", String(visible));
        mostrar.setAttribute(
          "aria-label",
          visible ? "Ocultar contraseña" : "Mostrar contraseña",
        );
      });

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        if (ingresar.disabled) return;

        const nombreUsuario = usuario.value.trim();

        if (!nombreUsuario) {
          mensaje.textContent = "Escribe tu usuario.";
          mensaje.hidden = false;
          usuario.focus();
          return;
        }

        mensaje.hidden = true;
        ingresar.disabled = true;
        ingresar.textContent = "Ingresando...";
        formulario.setAttribute("aria-busy", "true");

        try {
          const respuesta = await fetch(`${urlApi}/auth/login`, {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              usuario: nombreUsuario,
              password: password.value,
            }),
            signal: AbortSignal.timeout(15000),
          });

          if (respuesta.status === 401) {
            throw new Error("Usuario o contraseña incorrectos.");
          }

          if (respuesta.status === 429) {
            throw new Error(
              "Demasiados intentos. Espera un momento y vuelve a intentar.",
            );
          }

          if (respuesta.status === 404) {
            throw new Error(
              "El servicio de inicio de sesión todavía no está disponible.",
            );
          }

          if (!respuesta.ok) {
            throw new Error(
              "No fue posible iniciar sesión. Intenta nuevamente.",
            );
          }

          // Confirmamos la sesión con el servidor antes de entrar.
          const sesion = await fetch(`${urlApi}/auth/sesion`, {
            credentials: "include",
            cache: "no-store",
            signal: AbortSignal.timeout(15000),
          });

          if (!sesion.ok) {
            throw new Error(
              "No fue posible confirmar la sesión. Intenta nuevamente.",
            );
          }

          const resultado = await sesion.json();

          if (resultado.autenticado !== true) {
            throw new Error("La sesión no está activa.");
          }

          password.value = "";
          window.location.replace("/");
        } catch (error) {
          mensaje.textContent =
            error.name === "TimeoutError"
              ? "El servidor tardó demasiado en responder."
              : error instanceof TypeError
                ? "No fue posible conectar con el servidor."
                : error.message;

          mensaje.hidden = false;
        } finally {
          ingresar.disabled = false;
          ingresar.textContent = "Iniciar sesión";
          formulario.removeAttribute("aria-busy");
        }
      });
    </script>
  </body>
</html>
